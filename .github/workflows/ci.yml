name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit tests
        run: node --test
      - name: Smoke — reports on the fixture repo
        run: node bin/ctxtrim.js test/fixtures/sample-repo --format json | head -5
